name: Tests

on:
  push:
  pull_request:

# Checks the bot's own logic with stand-in models. Calls no model, no search
# service and not Metaculus, so it needs no secrets and costs nothing.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
